[package]
name = "gnune"
version = "0.2.0"
edition = "2024"
description = "A Zune-inspired music and video player for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/ricperry/Gnune"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
tempfile = "3"
rand = "0.9"
roxmltree = "0.21"
url = "2"
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
openssl = "0.10"
sha2 = "0.10"
gstreamer = "0.24"
qrcodegen = "1.8"
